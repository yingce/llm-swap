x-worker-common: &worker-common
  image: ${WORKER_IMAGE:-llmswap-agent:frp-cu128}
  build:
    context: ../..
    dockerfile: Dockerfile.agent
    args:
      LLMSWAP_RUNTIME: all
      LLMSWAP_INSTALL_TAILSCALE: "0"
  environment:
    LLMSWAP_GATEWAY_URL: ${LLMSWAP_GATEWAY_URL:?set LLMSWAP_GATEWAY_URL}
    LLMSWAP_AGENT_TOKEN_FILE: /run/secrets/agent_token
    LLMSWAP_AGENT_TAGS: gpu-4090
  secrets:
    - source: agent_token
      target: agent_token
      mode: 0400
  extra_hosts:
    - gateway-host:host-gateway
  networks:
    - worker-private
  init: true
  restart: unless-stopped
  stop_grace_period: 45s

services:
  worker-gpu0:
    <<: *worker-common
    hostname: worker-gpu0
    volumes:
      - type: bind
        source: ${WORKER_STATE_ROOT:?set WORKER_STATE_ROOT}/worker-gpu0/logs
        target: /opt/llmswap/logs
      - type: bind
        source: ${MODEL_ROOT:?set MODEL_ROOT}
        target: /opt/llmswap/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  worker-gpu1:
